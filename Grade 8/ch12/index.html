<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Grade 8 Mensuration - Competency Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef3f6 0%,#f7f3ea 100%);
  color:#17324a;
}

/* ---------- screens ---------- */
.screen{
  display:none;
  width:100%;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.screen.active{display:flex}

/* ---------- splash / intro ---------- */
#splash{
  background:linear-gradient(135deg,#e8eef2,#f4efe6);
}
.logoBox{
  background:#fff;
  border:2px solid #d6e0e6;
  border-radius:24px;
  padding:26px;
  box-shadow:0 10px 28px rgba(40,63,78,.14);
}
.logoBox img{
  width:min(300px,78vw);
  display:block;
}
.introCard,.resultCard{
  width:min(760px,94vw);
  background:#fff;
  border:2px solid #d7e0e5;
  border-radius:24px;
  padding:28px;
  text-align:center;
  box-shadow:0 14px 34px rgba(44,67,82,.14);
}
h1{
  color:#1e5876;
  font-size:clamp(28px,5vw,44px);
  margin-bottom:12px;
}
p{
  font-size:clamp(16px,2.8vw,20px);
  line-height:1.5;
}
.primaryBtn{
  border:0;
  margin-top:18px;
  padding:13px 24px;
  border-radius:14px;
  background:#1e6f8d;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  min-height:46px;
}

/* ---------- game shell ---------- */
#game{
  padding:0;
  align-items:stretch;
  justify-content:flex-start;
  flex-direction:column;
  background:linear-gradient(135deg,#eaf1f4 0%,#f8f2e7 100%);
}
#game.active{display:flex}

.topbar{
  width:100%;
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  padding:10px 12px;
  background:#173f52;
  border-bottom:3px solid #d8a84b;
}
.stat{
  min-width:0;
  background:#fff8e8;
  border:2px solid #e2c77c;
  border-radius:14px;
  padding:9px 8px;
  text-align:center;
  font-weight:800;
  font-size:clamp(12px,1.9vw,16px);
  color:#274253;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gameArea{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  display:flex;
  align-items:stretch;
  justify-content:center;
  padding:10px;
}
.quizCard{
  width:min(980px,100%);
  min-height:0;
  background:#fff;
  border:2px solid #cfdae0;
  border-radius:20px;
  padding:16px;
  box-shadow:0 10px 28px rgba(39,63,78,.12);
  display:flex;
  flex-direction:column;
}

.topicTag{
  align-self:center;
  background:#1e5876;
  color:#fff;
  border-radius:999px;
  padding:7px 15px;
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
}
.questionBox{
  background:#fbfcfd;
  border:2px solid #a9c0cc;
  border-radius:16px;
  padding:18px;
  font-size:clamp(18px,2.5vw,24px);
  font-weight:800;
  line-height:1.38;
  color:#1c3446;
  min-height:140px;
  display:flex;
  align-items:center;
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}
.option{
  border:2px solid #cfd9df;
  background:#fff;
  border-radius:14px;
  min-height:66px;
  padding:12px 14px;
  font-size:clamp(16px,2.1vw,20px);
  font-weight:800;
  color:#213847;
  cursor:pointer;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
}
.option.selected{border-color:#d49a31;background:#fff7df}
.option.correct{border-color:#1d9a62;background:#dff7e9;color:#0f6b45}
.option.wrong{border-color:#d14b4b;background:#ffe3e3;color:#8c2626}
.option.disabled{pointer-events:none;opacity:.96}

.feedback{
  min-height:50px;
  margin-top:12px;
  padding:10px 12px;
  border-radius:12px;
  background:#f4f7f8;
  font-size:15px;
  line-height:1.35;
  font-weight:700;
  color:#274253;
}
.nextBtn{
  display:none;
  align-self:center;
  margin-top:10px;
  border:0;
  min-height:46px;
  padding:11px 22px;
  border-radius:13px;
  background:#1e6f8d;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.finalScore{
  font-size:clamp(32px,7vw,58px);
  font-weight:900;
  color:#1e6f8d;
  margin:14px 0;
}

/* ---------- tablet ---------- */
@media(max-width:760px){
  .screen{padding:10px}
  .topbar{gap:5px;padding:7px 8px}
  .stat{padding:7px 5px;font-size:12px}
  .gameArea{padding:7px}
  .quizCard{padding:10px;border-radius:16px}
  .topicTag{font-size:13px;padding:5px 11px;margin-bottom:7px}
  .questionBox{
    min-height:118px;
    padding:14px 12px;
    font-size:18px;
    line-height:1.32;
  }
  .options{
    grid-template-columns:1fr;
    gap:7px;
    margin-top:8px;
  }
  .option{
    min-height:52px;
    padding:9px 10px;
    font-size:16px;
  }
  .feedback{
    min-height:42px;
    margin-top:8px;
    padding:8px 9px;
    font-size:13px;
  }
  .nextBtn{
    margin-top:8px;
    min-height:44px;
    font-size:15px;
    padding:9px 18px;
  }
}

/* ---------- phones: full screen, no overlap ---------- */
@media(max-width:520px){
  #game.active{
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .topbar{
    flex:0 0 46px;
    height:46px;
    padding:5px;
    gap:4px;
  }
  .stat{
    border-radius:10px;
    border-width:1.5px;
    padding:4px 3px;
    font-size:10.5px;
  }
  .gameArea{
    flex:1 1 auto;
    min-height:0;
    padding:5px;
    overflow:hidden;
  }
  .quizCard{
    width:100%;
    height:100%;
    min-height:0;
    padding:7px;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .topicTag{
    flex:0 0 auto;
    font-size:12px;
    padding:4px 9px;
    margin-bottom:5px;
  }
  .questionBox{
    flex:0 0 auto;
    min-height:108px;
    padding:10px;
    font-size:15.5px;
    line-height:1.26;
  }
  .options{
    flex:0 0 auto;
    gap:5px;
    margin-top:6px;
  }
  .option{
    min-height:46px;
    padding:7px 8px;
    font-size:14px;
    line-height:1.18;
  }
  .feedback{
    flex:0 0 auto;
    min-height:36px;
    margin-top:6px;
    padding:7px 8px;
    font-size:12px;
    line-height:1.22;
  }
  .nextBtn{
    position:sticky;
    bottom:4px;
    z-index:10;
    flex:0 0 auto;
    width:min(220px,80%);
    margin:7px auto 2px;
    min-height:44px;
    font-size:14px;
    box-shadow:0 0 0 4px rgba(255,255,255,.95);
  }
}

/* short phones: preserve readable font and scroll instead of shrinking */
@media(max-width:520px) and (max-height:650px){
  #game.active{overflow:auto;height:auto;min-height:100dvh}
  .gameArea{overflow:visible;min-height:calc(100dvh - 46px)}
  .quizCard{height:auto;min-height:calc(100dvh - 56px);overflow:visible}
  .questionBox{min-height:92px;font-size:14px}
  .option{min-height:42px;font-size:13px}
}
</style>

<body>


<section id="splash" class="screen active">
  <div class="logoBox">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
  </div>
</section>

<section id="intro" class="screen">
  <div class="introCard">
    <h1>Mensuration</h1>
    <p>Read each question carefully and choose the correct answer.</p>
    <p style="margin-top:10px;">You have two attempts for each question.</p>
    <button class="primaryBtn" onclick="startGame()">Start Quiz</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <div class="stat" id="scoreBadge">Score: 0</div>
    <div class="stat" id="progressBadge">Question: 1/10</div>
    <div class="stat" id="attemptBadge">Attempts: 2</div>
  </div>

  <div class="gameArea">
    <div id="quizCard" class="quizCard">
      <div class="topicTag">Mensuration</div>
      <div id="questionText" class="questionBox"></div>
      <div id="optionsBox" class="options"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="nextBtn" onclick="nextQuestion()">Next Question →</button>
    </div>
  </div>
</section>

<section id="result" class="screen">
  <div class="resultCard">
    <h1>Quiz Complete</h1>
    <p>Your score:</p>
    <div id="finalScore" class="finalScore"></div>
    <p id="finalMessage"></p>
    <button class="primaryBtn" onclick="restartGame()">Play Again</button>
  </div>
</section>

<script>
const questions=[
{q:"A rectangular room is 10 m long and 6 m wide. A 1 m wide border is left uncovered along all four sides. What area will be carpeted?",options:["24 m²","32 m²","40 m²","48 m²"],answer:"32 m²",explain:"Inner dimensions are 8 m and 4 m. Carpeted area = 8 × 4 = 32 m²."},
{q:"A square garden has side 10 m. A 1 m wide path is made inside along the boundary. What is the area of the path?",options:["32 m²","36 m²","40 m²","64 m²"],answer:"36 m²",explain:"Outer area = 10² = 100 m² and inner area = 8² = 64 m². Path area = 100 − 64 = 36 m²."},
{q:"A cuboidal tank is 2 m long, 1 m wide and 1.5 m high. How much water can it hold?",options:["300 L","3,000 L","1,500 L","30,000 L"],answer:"3,000 L",explain:"Volume = 2 × 1 × 1.5 = 3 m³. Since 1 m³ = 1000 L, capacity = 3000 L."},
{q:"A cube has edge 5 cm. Only five of its faces are painted. What area is painted?",options:["25 cm²","100 cm²","125 cm²","150 cm²"],answer:"125 cm²",explain:"Area of one face = 5² = 25 cm². For five faces, area = 5 × 25 = 125 cm²."},
{q:"A trapezium has parallel sides 10 m and 6 m, and height 5 m. What is its area?",options:["30 m²","40 m²","50 m²","80 m²"],answer:"40 m²",explain:"Area of trapezium = 1/2 × (10 + 6) × 5 = 1/2 × 16 × 5 = 40 m²."},
{q:"A cylindrical can has radius 7 cm and height 5 cm. A label covers only its curved surface. Using π = 22/7, what area of label is required?",options:["110 cm²","220 cm²","440 cm²","770 cm²"],answer:"220 cm²",explain:"Curved surface area = 2πrh = 2 × 22/7 × 7 × 5 = 220 cm²."},
{q:"A box measures 30 cm × 20 cm × 10 cm. Cubes of edge 10 cm are packed inside it. How many cubes fit exactly?",options:["5","6","10","12"],answer:"6",explain:"Number of cubes = (30 ÷ 10) × (20 ÷ 10) × (10 ÷ 10) = 3 × 2 × 1 = 6."},
{q:"A rectangular floor is 4 m long and 3 m wide. Square tiles of side 1 m are used. How many tiles are required?",options:["7","12","14","16"],answer:"12",explain:"Floor area = 4 × 3 = 12 m². Each tile covers 1 m², so 12 tiles are required."},
{q:"A cuboid has volume 120 cm³. Its length is 6 cm and breadth is 4 cm. What is its height?",options:["4 cm","5 cm","6 cm","10 cm"],answer:"5 cm",explain:"Height = 120 ÷ (6 × 4) = 120 ÷ 24 = 5 cm."},
{q:"A cube has edge 3 cm. Another cube has edge 6 cm. How many times greater is the volume of the larger cube?",options:["2 times","4 times","6 times","8 times"],answer:"8 times",explain:"The edge is doubled, so the volume becomes 2³ = 8 times."}
];

let shuffledQuestions=[],current=0,score=0,attempts=2,answered=false;
const splash=document.getElementById("splash");
const intro=document.getElementById("intro");
const game=document.getElementById("game");
const result=document.getElementById("result");
const questionText=document.getElementById("questionText");
const optionsBox=document.getElementById("optionsBox");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const scoreBadge=document.getElementById("scoreBadge");
const progressBadge=document.getElementById("progressBadge");
const attemptBadge=document.getElementById("attemptBadge");

setTimeout(()=>showScreen(intro),1800);

function showScreen(screen){
  [splash,intro,game,result].forEach(s=>s.classList.remove("active"));
  screen.classList.add("active");
}

function shuffleArray(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function startGame(){
  shuffledQuestions=shuffleArray(questions);
  current=0;
  score=0;
  showScreen(game);
  loadQuestion();
}

function loadQuestion(){
  attempts=2;
  answered=false;
  feedback.textContent="";
  nextBtn.style.display="none";
  optionsBox.innerHTML="";
  const item=shuffledQuestions[current];
  questionText.textContent=item.q;

  shuffleArray(item.options).forEach(option=>{
    const div=document.createElement("button");
    div.type="button";
    div.className="option";
    div.textContent=option;
    div.dataset.value=option;
    div.addEventListener("click",()=>checkAnswer(div,option));
    optionsBox.appendChild(div);
  });

  updateBadges();
}

function checkAnswer(selectedDiv,selectedOption){
  if(answered)return;

  document.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));
  selectedDiv.classList.add("selected");
  const item=shuffledQuestions[current];

  if(selectedOption===item.answer){
    answered=true;
    score++;
    selectedDiv.classList.add("correct");
    feedback.textContent="Correct. "+item.explain;
    disableOptions();
    nextBtn.style.display="block";
  }else{
    attempts--;
    selectedDiv.classList.add("wrong");

    if(attempts>0){
      feedback.textContent="Try once more. Check your calculation carefully.";
      selectedDiv.classList.add("disabled");
    }else{
      answered=true;
      feedback.textContent="Correct answer: "+item.answer+". "+item.explain;
      showCorrectAnswer(item.answer);
      disableOptions();
      nextBtn.style.display="block";
    }
  }
  updateBadges();
}

function showCorrectAnswer(answer){
  document.querySelectorAll(".option").forEach(opt=>{
    if(opt.dataset.value===answer)opt.classList.add("correct");
  });
}

function disableOptions(){
  document.querySelectorAll(".option").forEach(opt=>{
    opt.classList.add("disabled");
    opt.disabled=true;
  });
}

function updateBadges(){
  scoreBadge.textContent="Score: "+score;
  progressBadge.textContent="Question: "+(current+1)+"/10";
  attemptBadge.textContent="Attempts: "+attempts;
}

function nextQuestion(){
  current++;
  if(current>=shuffledQuestions.length){
    endGame();
  }else{
    loadQuestion();
  }
}

function endGame(){
  showScreen(result);
  document.getElementById("finalScore").textContent=score+" / 10";
  const msg=
    score>=9?"Excellent work. You selected the correct mensuration measure accurately in almost every situation.":
    score>=7?"Good work. Review the few situations where area, perimeter, surface area or volume were confused.":
    score>=5?"Keep practising. Focus on identifying what the situation asks you to measure before choosing a formula.":
    "Review area, perimeter, surface area and volume, then try the situations again.";
  document.getElementById("finalMessage").textContent=msg;
}

function restartGame(){
  startGame();
}

</script>
</body>
</html>
