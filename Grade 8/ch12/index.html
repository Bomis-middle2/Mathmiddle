<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Grade 8 Mensuration - Competency Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef3f6 0%,#f7f3ea 100%);
  color:#17324a;
}

/* ---------- screens ---------- */
.screen{
  display:none;
  width:100%;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:16px;
}
.screen.active{display:flex}

/* ---------- splash / intro ---------- */
#splash{
  background:linear-gradient(135deg,#e8eef2,#f4efe6);
}
.logoBox{
  background:#fff;
  border:2px solid #d6e0e6;
  border-radius:24px;
  padding:26px;
  box-shadow:0 10px 28px rgba(40,63,78,.14);
}
.logoBox img{
  width:min(300px,78vw);
  display:block;
}
.introCard,.resultCard{
  width:min(760px,94vw);
  background:#fff;
  border:2px solid #d7e0e5;
  border-radius:24px;
  padding:28px;
  text-align:center;
  box-shadow:0 14px 34px rgba(44,67,82,.14);
}
h1{
  color:#1e5876;
  font-size:clamp(28px,5vw,44px);
  margin-bottom:12px;
}
p{
  font-size:clamp(16px,2.8vw,20px);
  line-height:1.5;
}
.primaryBtn{
  border:0;
  margin-top:18px;
  padding:13px 24px;
  border-radius:14px;
  background:#1e6f8d;
  color:#fff;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  min-height:46px;
}

/* ---------- game shell ---------- */
#game{
  padding:0;
  align-items:stretch;
  justify-content:flex-start;
  flex-direction:column;
  background:linear-gradient(135deg,#eaf1f4 0%,#f8f2e7 100%);
}
#game.active{display:flex}

.topbar{
  width:100%;
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  padding:10px 12px;
  background:#173f52;
  border-bottom:3px solid #d8a84b;
}
.stat{
  min-width:0;
  background:#fff8e8;
  border:2px solid #e2c77c;
  border-radius:14px;
  padding:9px 8px;
  text-align:center;
  font-weight:800;
  font-size:clamp(12px,1.9vw,16px);
  color:#274253;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.gameArea{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  display:flex;
  align-items:stretch;
  justify-content:center;
  padding:10px;
}
.quizCard{
  width:min(980px,100%);
  min-height:0;
  background:#fff;
  border:2px solid #cfdae0;
  border-radius:20px;
  padding:16px;
  box-shadow:0 10px 28px rgba(39,63,78,.12);
  display:flex;
  flex-direction:column;
}

.topicTag{
  align-self:center;
  background:#1e5876;
  color:#fff;
  border-radius:999px;
  padding:7px 15px;
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
}
.questionBox{
  background:#fbfcfd;
  border:2px solid #a9c0cc;
  border-radius:16px;
  padding:18px;
  font-size:clamp(18px,2.5vw,24px);
  font-weight:800;
  line-height:1.38;
  color:#1c3446;
  min-height:140px;
  display:flex;
  align-items:center;
}
.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}
.option{
  border:2px solid #cfd9df;
  background:#fff;
  border-radius:14px;
  min-height:66px;
  padding:12px 14px;
  font-size:clamp(16px,2.1vw,20px);
  font-weight:800;
  color:#213847;
  cursor:pointer;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
}
.option.selected{border-color:#d49a31;background:#fff7df}
.option.correct{border-color:#1d9a62;background:#dff7e9;color:#0f6b45}
.option.wrong{border-color:#d14b4b;background:#ffe3e3;color:#8c2626}
.option.disabled{pointer-events:none;opacity:.96}

.feedback{
  min-height:50px;
  margin-top:12px;
  padding:10px 12px;
  border-radius:12px;
  background:#f4f7f8;
  font-size:15px;
  line-height:1.35;
  font-weight:700;
  color:#274253;
}
.nextBtn{
  display:none;
  align-self:center;
  margin-top:10px;
  border:0;
  min-height:46px;
  padding:11px 22px;
  border-radius:13px;
  background:#1e6f8d;
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

.finalScore{
  font-size:clamp(32px,7vw,58px);
  font-weight:900;
  color:#1e6f8d;
  margin:14px 0;
}

/* ---------- tablet ---------- */
@media(max-width:760px){
  .screen{padding:10px}
  .topbar{gap:5px;padding:7px 8px}
  .stat{padding:7px 5px;font-size:12px}
  .gameArea{padding:7px}
  .quizCard{padding:10px;border-radius:16px}
  .topicTag{font-size:13px;padding:5px 11px;margin-bottom:7px}
  .questionBox{
    min-height:118px;
    padding:14px 12px;
    font-size:18px;
    line-height:1.32;
  }
  .options{
    grid-template-columns:1fr;
    gap:7px;
    margin-top:8px;
  }
  .option{
    min-height:52px;
    padding:9px 10px;
    font-size:16px;
  }
  .feedback{
    min-height:42px;
    margin-top:8px;
    padding:8px 9px;
    font-size:13px;
  }
  .nextBtn{
    margin-top:8px;
    min-height:44px;
    font-size:15px;
    padding:9px 18px;
  }
}

/* ---------- phones: full screen, no overlap ---------- */
@media(max-width:520px){
  #game.active{
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  .topbar{
    flex:0 0 46px;
    height:46px;
    padding:5px;
    gap:4px;
  }
  .stat{
    border-radius:10px;
    border-width:1.5px;
    padding:4px 3px;
    font-size:10.5px;
  }
  .gameArea{
    flex:1 1 auto;
    min-height:0;
    padding:5px;
    overflow:hidden;
  }
  .quizCard{
    width:100%;
    height:100%;
    min-height:0;
    padding:7px;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }
  .topicTag{
    flex:0 0 auto;
    font-size:12px;
    padding:4px 9px;
    margin-bottom:5px;
  }
  .questionBox{
    flex:0 0 auto;
    min-height:108px;
    padding:10px;
    font-size:15.5px;
    line-height:1.26;
  }
  .options{
    flex:0 0 auto;
    gap:5px;
    margin-top:6px;
  }
  .option{
    min-height:46px;
    padding:7px 8px;
    font-size:14px;
    line-height:1.18;
  }
  .feedback{
    flex:0 0 auto;
    min-height:36px;
    margin-top:6px;
    padding:7px 8px;
    font-size:12px;
    line-height:1.22;
  }
  .nextBtn{
    position:sticky;
    bottom:4px;
    z-index:10;
    flex:0 0 auto;
    width:min(220px,80%);
    margin:7px auto 2px;
    min-height:44px;
    font-size:14px;
    box-shadow:0 0 0 4px rgba(255,255,255,.95);
  }
}

/* short phones: preserve readable font and scroll instead of shrinking */
@media(max-width:520px) and (max-height:650px){
  #game.active{overflow:auto;height:auto;min-height:100dvh}
  .gameArea{overflow:visible;min-height:calc(100dvh - 46px)}
  .quizCard{height:auto;min-height:calc(100dvh - 56px);overflow:visible}
  .questionBox{min-height:92px;font-size:14px}
  .option{min-height:42px;font-size:13px}
}
</style>
</head>
<body>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<section id="splash" class="screen active">
  <div class="logoBox">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
  </div>
</section>

<section id="intro" class="screen">
  <div class="introCard">
    <h1>Mensuration Challenge</h1>
    <p>Read each real-life situation carefully and choose the mathematically correct answer.</p>
    <p style="margin-top:10px;">You get two attempts for each question.</p>
    <button class="primaryBtn" onclick="startGame()">Start Quiz</button>
  </div>
</section>

<section id="game" class="screen">
  <div class="topbar">
    <div class="stat" id="scoreBadge">Score: 0</div>
    <div class="stat" id="progressBadge">Question: 1/10</div>
    <div class="stat" id="attemptBadge">Attempts: 2</div>
  </div>

  <div class="gameArea">
    <div id="quizCard" class="quizCard">
      <div class="topicTag">Mensuration</div>
      <div id="questionText" class="questionBox"></div>
      <div id="optionsBox" class="options"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="nextBtn" onclick="nextQuestion()">Next Question →</button>
    </div>
  </div>
</section>

<section id="result" class="screen">
  <div class="resultCard">
    <h1>Quiz Complete</h1>
    <p>Your score:</p>
    <div id="finalScore" class="finalScore"></div>
    <p id="finalMessage"></p>
    <button class="primaryBtn" onclick="restartGame()">Play Again</button>
  </div>
</section>

<script>
const questions=[
{q:"A rectangular classroom floor is 12 m long and 8 m wide. The school wants to cover the entire floor with carpet. What area of carpet is required?",options:["96 m²","40 m²","80 m²","192 m²"],answer:"96 m²",explain:"Area of rectangle = length × breadth = 12 × 8 = 96 m²."},
{q:"A square garden has side 15 m. The gardener wants to place fencing all around it. What length of fencing is required?",options:["60 m","225 m","45 m","30 m"],answer:"60 m",explain:"Perimeter of square = 4 × side = 4 × 15 = 60 m."},
{q:"A cuboidal water tank is 4 m long, 3 m wide and 2 m high. What is its capacity in cubic metres?",options:["24 m³","9 m³","14 m³","48 m³"],answer:"24 m³",explain:"Volume of cuboid = l × b × h = 4 × 3 × 2 = 24 m³."},
{q:"A cube-shaped storage box has edge 6 cm. If all six outer faces are to be painted, what total area will be painted?",options:["216 cm²","36 cm²","144 cm²","72 cm²"],answer:"216 cm²",explain:"Total surface area of cube = 6a² = 6 × 6² = 216 cm²."},
{q:"A rectangular park is 25 m long and 16 m wide. A fence is to be placed along its boundary. What total length of fencing is needed?",options:["82 m","400 m","41 m","66 m"],answer:"82 m",explain:"Perimeter = 2(l + b) = 2(25 + 16) = 82 m."},
{q:"A cylindrical drum has radius 7 cm and height 10 cm. Only its curved side is to be covered with a label. Using π = 22/7, what area of label is needed?",options:["440 cm²","1540 cm²","220 cm²","770 cm²"],answer:"440 cm²",explain:"Curved surface area = 2πrh = 2 × 22/7 × 7 × 10 = 440 cm²."},
{q:"A cuboidal gift box is 20 cm long, 10 cm wide and 8 cm high. What volume of space is available inside the box?",options:["1600 cm³","760 cm³","38 cm³","400 cm³"],answer:"1600 cm³",explain:"Volume = l × b × h = 20 × 10 × 8 = 1600 cm³."},
{q:"A square tile has side 30 cm. What floor area does one tile cover?",options:["900 cm²","120 cm²","60 cm²","300 cm²"],answer:"900 cm²",explain:"Area of square = side² = 30² = 900 cm²."},
{q:"A rectangular notice board has area 1800 cm² and length 60 cm. What must its breadth be?",options:["30 cm","40 cm","20 cm","45 cm"],answer:"30 cm",explain:"Breadth = area ÷ length = 1800 ÷ 60 = 30 cm."},
{q:"A cube-shaped dice has edge 3 cm. What is the volume of the dice?",options:["27 cm³","18 cm³","9 cm³","36 cm³"],answer:"27 cm³",explain:"Volume of cube = side³ = 3³ = 27 cm³."}
];

let shuffledQuestions=[],current=0,score=0,attempts=2,answered=false;
const splash=document.getElementById("splash");
const intro=document.getElementById("intro");
const game=document.getElementById("game");
const result=document.getElementById("result");
const questionText=document.getElementById("questionText");
const optionsBox=document.getElementById("optionsBox");
const feedback=document.getElementById("feedback");
const nextBtn=document.getElementById("nextBtn");
const scoreBadge=document.getElementById("scoreBadge");
const progressBadge=document.getElementById("progressBadge");
const attemptBadge=document.getElementById("attemptBadge");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

setTimeout(()=>showScreen(intro),3000);

function showScreen(screen){
  [splash,intro,game,result].forEach(s=>s.classList.remove("active"));
  screen.classList.add("active");
}

function shuffleArray(arr){
  return [...arr].sort(()=>Math.random()-.5);
}

function startGame(){
  shuffledQuestions=shuffleArray(questions);
  current=0;
  score=0;
  showScreen(game);
  loadQuestion();
}

function loadQuestion(){
  attempts=2;
  answered=false;
  feedback.textContent="";
  nextBtn.style.display="none";
  optionsBox.innerHTML="";
  const item=shuffledQuestions[current];
  questionText.textContent=item.q;

  shuffleArray(item.options).forEach(option=>{
    const div=document.createElement("button");
    div.type="button";
    div.className="option";
    div.textContent=option;
    div.dataset.value=option;
    div.addEventListener("click",()=>checkAnswer(div,option));
    optionsBox.appendChild(div);
  });

  updateBadges();
}

function checkAnswer(selectedDiv,selectedOption){
  if(answered)return;

  document.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));
  selectedDiv.classList.add("selected");
  const item=shuffledQuestions[current];

  if(selectedOption===item.answer){
    answered=true;
    score++;
    selectedDiv.classList.add("correct");
    feedback.textContent="Correct. "+item.explain;
    playSound(correctSound);
    disableOptions();
    nextBtn.style.display="block";
  }else{
    attempts--;
    selectedDiv.classList.add("wrong");
    playSound(wrongSound);

    if(attempts>0){
      feedback.textContent="Try once more. Check which mensuration measure is required.";
      selectedDiv.classList.add("disabled");
    }else{
      answered=true;
      feedback.textContent="Correct answer: "+item.answer+". "+item.explain;
      showCorrectAnswer(item.answer);
      disableOptions();
      nextBtn.style.display="block";
    }
  }
  updateBadges();
}

function showCorrectAnswer(answer){
  document.querySelectorAll(".option").forEach(opt=>{
    if(opt.dataset.value===answer)opt.classList.add("correct");
  });
}

function disableOptions(){
  document.querySelectorAll(".option").forEach(opt=>{
    opt.classList.add("disabled");
    opt.disabled=true;
  });
}

function updateBadges(){
  scoreBadge.textContent="Score: "+score;
  progressBadge.textContent="Question: "+(current+1)+"/10";
  attemptBadge.textContent="Attempts: "+attempts;
}

function nextQuestion(){
  current++;
  if(current>=shuffledQuestions.length){
    endGame();
  }else{
    loadQuestion();
  }
}

function endGame(){
  showScreen(result);
  document.getElementById("finalScore").textContent=score+" / 10";
  const msg=
    score>=9?"Excellent work. You selected the correct mensuration measure accurately in almost every situation.":
    score>=7?"Good work. Review the few situations where area, perimeter, surface area or volume were confused.":
    score>=5?"Keep practising. Focus on identifying what the situation asks you to measure before choosing a formula.":
    "Review area, perimeter, surface area and volume, then try the situations again.";
  document.getElementById("finalMessage").textContent=msg;
  playSound(clapSound);
}

function restartGame(){
  startGame();
}

function playSound(audio){
  if(!audio)return;
  audio.currentTime=0;
  audio.play().catch(()=>{});
}
</script>
</body>
</html>
